name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cognito hardcode lint
        run: |
          if [ -d prototype/backend/web ]; then
            bash ci/lint-no-hardcoded-cognito.sh
          else
            echo "skipped: no prototype/backend/web in this repo"
          fi
